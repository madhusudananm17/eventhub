<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EventHub | My Profile</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .profile-section {
            background: #f8f9fc;
            min-height: 80vh;
            padding: 60px 20px;
        }

        .profile-container {
            max-width: 1000px;
            margin: auto;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #667085;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        /* PROFILE CARD */

        .profile-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #e8e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 18px;
        }

        .profile-card h2 {
            font-size: 21px;
            margin-bottom: 5px;
        }

        .profile-card p {
            color: #667085;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-stat {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
        }

        .profile-stat strong {
            display: block;
            font-size: 22px;
            margin-bottom: 3px;
        }

        .profile-stat span {
            color: #667085;
            font-size: 13px;
        }

        /* PROFILE FORM */

        .profile-form-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .profile-form-card h2 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #635bff;
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .save-btn {
            margin-top: 25px;
            background: #635bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:hover {
            opacity: 0.85;
        }

        .success-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #e5f7ed;
            color: #16834b;
            border-radius: 8px;
            font-size: 14px;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .profile-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .page-title h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="container nav-container">

        <a href="../index.html" class="logo">

            <span>🎫</span>

            EventHub

        </a>


        <nav class="nav-menu" id="navMenu">

            <a href="../index.html">
                Home
            </a>

            <a href="../events.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="my-events.html">
                My Events
            </a>

            <a href="profile.html"
               class="active">
                Profile
            </a>

            <a href="../login.html">
                Logout
            </a>

        </nav>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </div>

</header>


<!-- ================= PROFILE ================= -->

<section class="profile-section">

    <div class="profile-container">


        <div class="page-title">

            <h1>
                My Profile
            </h1>

            <p>
                Manage your EventHub account information.
            </p>

        </div>


        <div class="profile-grid">


            <!-- ================= PROFILE SUMMARY ================= -->

            <div class="profile-card">

                <div class="profile-avatar">
                    👤
                </div>

                <h2>
                    User
                </h2>

                <p>
                    EventHub Member
                </p>


                <div class="profile-stat">

                    <strong>
                        4
                    </strong>

                    <span>
                        Registered Events
                    </span>

                </div>


                <div class="profile-stat">

                    <strong>
                        3
                    </strong>

                    <span>
                        Active Tickets
                    </span>

                </div>


            </div>


            <!-- ================= PROFILE FORM ================= -->

            <div class="profile-form-card">

                <h2>
                    Personal Information
                </h2>


                <form id="profileForm">


                    <div class="form-grid">


                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                value="User"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                value="user@gmail.com"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                value="+91 8088169018"
                            >

                        </div>


                        <div class="form-group">

                            <label for="city">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                value="Chikkaballapur"
                            >

                        </div>


                        <div class="form-group full">

                            <label for="state">
                                State
                            </label>

                            <input
                                type="text"
                                id="state"
                                value="Karnataka"
                            >

                        </div>


                    </div>


                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Changes
                    </button>


                    <div
                        class="success-message"
                        id="successMessage"
                    >
                        ✓ Profile updated successfully.
                    </div>


                </form>

            </div>


        </div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="footer-bottom">

        <p>
            © 2026 EventHub. All Rights Reserved.
        </p>

    </div>

</footer>


<script src="../js/main.js"></script>


<script>

    const profileForm =
        document.getElementById("profileForm");

    const successMessage =
        document.getElementById("successMessage");


    profileForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            successMessage.style.display =
                "block";

            setTimeout(function() {

                successMessage.style.display =
                    "none";

            }, 3000);

        }
    );

</script>


<script src="../js/main.js"></script>
<script src="../js/dashboard.js"></script>
</body>

</html>
